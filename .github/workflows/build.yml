name: Limitless kernel build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Kernel source branch, tag or commit
        required: true
        default: limitless/dev
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: limitless-build-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Check builder shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl device-tree-compiler file flex git libc++1-14 libelf-dev libncurses-dev libssl-dev lz4 make python-is-python3 python3 rsync xz-utils zlib1g-dev

      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare toolchains
        env:
          LIMITLESS_GCC_URL: ${{ vars.LIMITLESS_GCC_URL || 'https://github.com/SlimRoms/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/7280ce2399316a5dbd8872e0bfe69435d8719230.tar.gz' }}
          LIMITLESS_CLANG_URL: ${{ vars.LIMITLESS_CLANG_URL || 'https://github.com/AOSP-10/prebuilts_clang_host_linux-x86_clang-r383902/archive/23ba73b5770985b6bf5f38efceba99019178025c.tar.gz' }}
          LIMITLESS_GCC_DIR: ${{ vars.LIMITLESS_GCC_DIR }}
          LIMITLESS_CLANG_DIR: ${{ vars.LIMITLESS_CLANG_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/setup.sh 2>&1 | tee toolchain-setup.log
          echo "LIMITLESS_GCC_DIR=${LIMITLESS_GCC_DIR:-$PWD/.toolchains/gcc}" >> "$GITHUB_ENV"
          echo "LIMITLESS_CLANG_DIR=${LIMITLESS_CLANG_DIR:-$PWD/.toolchains/clang}" >> "$GITHUB_ENV"

      - name: Build and package kernel
        env:
          LIMITLESS_SOURCE_REF: ${{ steps.source.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build.sh 2>&1 | tee build.log

      - name: Validate outputs
        run: bash ./scripts/validate.sh

      - name: Collect payload
        shell: bash
        run: |
          mkdir -p release
          cp "$(cat validated-image.txt)" release/
          cp "$(cat validated-boot-image.txt)" release/boot.img
          cp source-commit.txt source-ref.txt toolchain-info.txt build.log release/
          cp out/boot-packaging-info.txt release/
          printf 'Source ref: %s\nDefconfig: a03_cis_open_defconfig\nArchitecture: arm64\n' "${{ steps.source.outputs.ref }}" > release/BUILD-INFO.txt
          (cd release && sha256sum * > SHA256SUMS)

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Limitless-diagnostics-${{ github.run_number }}
          path: |
            toolchain-setup.log
            build.log
            toolchain-info.txt
            ufdt-host-deps.log
            source-commit.txt
            source-ref.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Limitless-${{ github.event.release.tag_name || github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber
